# agents.conf - Ventanas que crea `vibe` en la sesion tmux.
#
# Formato, una por linea:
#
#     nombre | comando | directorio
#
#   nombre      Etiqueta de la ventana en tmux (corta: se ve en el movil).
#   comando     Se escribe en el prompt al crear la ventana. Dejar VACIO para
#               abrir solo una shell sin lanzar nada.
#   directorio  Opcional. Si se omite se usa $VIBE_DIR (por defecto $HOME).
#               Se expande ~ y variables de entorno.
#
# Las lineas vacias y las que empiezan por # se ignoran.
#
# El comando se ENVIA al prompt de la shell (send-keys), no reemplaza a la
# shell: si el agente termina o lo cierras, te quedas en bash con el historial
# intacto y lo relanzas con flecha arriba.

# --- Por defecto: shells limpias --------------------------------------------
# Nada arranca solo. Abres claude, opencode o codex a mano en la ventana que
# quieras, cuando quieras, con `prefijo + c` para una ventana nueva.
shell    |  |
shell2   |  |
shell3   |  |
shell4   |  |

# --- Ejemplos, por si algun dia quieres arranque automatico ------------------
# Descomenta y ajusta. El nombre corto se agradece en la pantalla del movil.
#
# claude   | claude            |
# opencode | opencode          |
# codex    | codex             |
# mi-proyecto     | claude --continue | ~/repos/mi-proyecto
#
# Para que el portatil no se suspenda mientras trabajas en remoto (ver
# docs/troubleshooting.md), esta ventana viene bien:
#
# awake | systemd-inhibit --what=sleep:idle --why="agentes remotos" sleep infinity |
