# tmux.conf - Configuracion pensada para atacar la sesion desde el movil.
#
# NO es tu ~/.tmux.conf. El script `vibe` lo carga solo para el servidor de
# agentes remotos, asi que tu tmux normal se queda como esta.

# --- Terminal y colores -----------------------------------------------------
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,xterm-ghostty:Tc"

# --- Comportamiento con varios clientes -------------------------------------
# Clave para el uso movil: sin esto, al atachar desde el iPhone tmux encoge
# TODAS las ventanas al tamano de la pantalla mas pequena y el portatil queda
# inutilizable. Con aggressive-resize solo se ajusta la ventana que el cliente
# pequeno esta viendo en ese momento.
setw -g aggressive-resize on

# No matar la sesion aunque no quede ningun cliente atachado. Los agentes
# siguen trabajando con el movil bloqueado.
set  -g destroy-unattached off
set  -g detach-on-destroy off

# --- Usabilidad tactil ------------------------------------------------------
# Con el raton activo puedes tocar la barra de estado para cambiar de ventana,
# arrastrar para redimensionar paneles y hacer scroll con el dedo.
set  -g mouse on

set  -g history-limit 50000
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Los agentes escupen mucho texto: sin esto, tmux se traga eventos.
set  -g escape-time 10
set  -g focus-events on
set  -g status-interval 5

# --- Prefijo ----------------------------------------------------------------
# Se mantiene Ctrl+b (default) y se anade Ctrl+a como alternativa, mucho mas
# comodo en el teclado en pantalla de iOS y en la fila de mods de Blink.
set  -g prefix C-b
set  -g prefix2 C-a
bind C-a send-prefix -2

# Recargar esta config: prefijo + r
bind r source-file ~/terminal-remote-job/config/tmux.conf \; display-message "tmux.conf recargado"

# --- Navegacion -------------------------------------------------------------
# Ventana anterior/siguiente sin soltar Ctrl (prefijo + Ctrl+n / Ctrl+p)
bind -r C-n next-window
bind -r C-p previous-window

# Paneles con hjkl (prefijo + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Dividir manteniendo el directorio actual
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# --- Copiado ----------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Barra de estado --------------------------------------------------------
# Compacta a proposito: en un iPhone caben pocas columnas.
set  -g status-position bottom
set  -g status-style "bg=colour235,fg=colour250"
set  -g status-left  "#[bg=colour24,fg=colour255,bold] #S #[default] "
set  -g status-left-length 20
set  -g status-right "#[fg=colour244]#{?client_readonly,[RO] ,}#H #[fg=colour109]%H:%M "
set  -g status-right-length 30

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=colour255,bold] #I:#W "
setw -g window-status-activity-style "fg=colour214"

# Avisar cuando un agente termina de escupir en una ventana que no estas viendo
setw -g monitor-activity on
set  -g visual-activity off

set  -g pane-border-style        "fg=colour238"
set  -g pane-active-border-style "fg=colour24"
