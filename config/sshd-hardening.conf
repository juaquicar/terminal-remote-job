# sshd-hardening.conf
#
# Drop-in para /etc/ssh/sshd_config.d/50-terminal-remote-job.conf
# Lo instala `install.sh --harden`, que antes comprueba que exista al menos
# una clave en ~/.ssh/authorized_keys.
#
# AVISO: con PasswordAuthentication no, si pierdes la clave privada del movil
# solo podras entrar fisicamente en el portatil. Eso es aceptable aqui porque
# el portatil lo tienes delante; en un servidor remoto guarda una segunda clave
# de rescate antes de aplicar esto.

# Solo clave publica. Cierra la puerta a fuerza bruta de contrasenas.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Root nunca entra por SSH.
PermitRootLogin no

# Solo este usuario. install.sh sustituye el valor por el usuario real.
AllowUsers usuario

# Superficie de ataque: nada de X11 ni de reenvios que no usas.
# Nota: AllowTcpForwarding no rompe mosh (mosh no lo usa) pero SI rompe
# `ssh -L` para tuneles. Ponlo en yes si algun dia quieres tunelizar puertos.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Cortar sesiones zombis: el movil pierde cobertura a menudo y deja sshd
# colgados. Con mosh esto es irrelevante (la sesion mosh sobrevive aparte).
ClientAliveInterval 60
ClientAliveCountMax 3

# Menos ventana para intentos fallidos.
MaxAuthTries 3
LoginGraceTime 30
